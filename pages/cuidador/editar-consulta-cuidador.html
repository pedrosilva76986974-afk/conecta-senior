<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d3b66">
  <title>Editar consulta · ConectaSênior</title>
  <link rel="stylesheet" href="../../styles.css">
</head>
<body>
  <main class="artboard edit-consulta-page" id="editar-consulta-page" aria-label="Editar consulta">
    <header class="edit-consulta-header">
      <h1>Editar consulta</h1>
    </header>
    <div class="edit-consulta-content">
      <form class="edit-consulta-form" id="appointment-form">
        <div class="edit-field-group">
          <label for="edit-specialty">Especialidade ou motivo</label>
          <input id="edit-specialty" name="specialty" type="text" placeholder="Ex.: Cardiologista" required>
        </div>
        <div class="edit-field-group">
          <label for="edit-date">Data</label>
          <input id="edit-date" name="date" type="date" required>
        </div>
        <div class="edit-field-group">
          <label for="edit-time">Horário</label>
          <input id="edit-time" name="time" type="time" required>
        </div>
        <div class="edit-field-group">
          <label for="edit-location">Local</label>
          <input id="edit-location" name="location" type="text" placeholder="Clínica, endereço ou online" required>
        </div>
        <div class="edit-map-group">
          <iframe id="appointment-map" class="edit-consulta-map" title="Mapa do endereço da consulta" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
        <p class="visually-hidden" id="appointment-form-message" role="status" aria-live="polite"></p>
        <div class="edit-consulta-actions">
          <button class="edit-save-button" type="submit">Salvar consulta</button>
          <button class="edit-delete-button" id="appointment-delete" type="button">Excluir consulta</button>
          <a class="edit-cancel-button" href="/pages/cuidador/agenda-consultas-cuidador.html">Cancelar</a>
        </div>
      </form>
    </div>
  </main>
  <script src="/scripts/consultas.js" defer></script>
  <script src="/scripts/modo-prototipo.js" defer></script>
</body>
</html>
