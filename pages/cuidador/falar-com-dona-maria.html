<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d3b66">
  <title>Falar com Dona Maria · ConectaSênior</title>
  <link rel="stylesheet" href="../../styles.css">
</head>
<body>
  <main class="artboard call-confirm-board" aria-labelledby="call-heading">
    <div class="canvas call-confirm-canvas">
      <header class="call-confirm-header">
        <a href="/pages/cuidador/painel-familia.html" aria-label="Voltar para o acompanhamento">‹</a>
        <h1 id="call-heading">Falar com Dona Maria</h1>
      </header>
      <section class="call-confirm-card">
        <div class="call-confirm-icon" aria-hidden="true">☎</div>
        <h2>Iniciar ligação?</h2>
        <p>Você está prestes a ligar para Dona Maria.</p>
        <button class="start-call-button" id="start-call" type="button">Ligar para Dona Maria</button>
        <a class="cancel-call-link" href="/pages/cuidador/painel-familia.html">Agora não</a>
      </section>
    </div>
  </main>
  <script src="/scripts/modo-prototipo.js" defer></script>
  <script src="/scripts/falar-com-dona-maria.js" defer></script>
</body>
</html>
