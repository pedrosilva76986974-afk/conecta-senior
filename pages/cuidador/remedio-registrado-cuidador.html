<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d3b66">
  <title>Detalhes do remédio · ConectaSênior</title>
  <link rel="stylesheet" href="../../styles.css">
</head>
<body>
  <main class="artboard medicine-detail-page" id="medicine-detail-page" aria-label="Detalhes do remédio">
    <header class="medicine-detail-header"><h1>Detalhes do remédio</h1></header>
    <div class="medicine-detail-content">
      <section id="medicine-detail" class="medicine-detail-card" aria-live="polite">
        <h2 id="medicine-detail-name">Carregando remédio…</h2>
        <p id="medicine-detail-status" class="medication-status"></p>
        <dl id="medicine-detail-fields" class="medicine-detail-fields"></dl>
      </section>
      <p id="medicine-detail-message" class="medicine-detail-message" role="status" aria-live="polite"></p>
      <div class="medicine-detail-actions">
        <button id="medicine-delete" class="medicine-delete-button" type="button">Excluir</button>
        <a class="medicine-back-button" href="/pages/cuidador/meus-remedios-cuidador.html">Cancelar</a>
      </div>
    </div>
  </main>
  <script src="/scripts/remedios.js" defer></script>
  <script src="/scripts/modo-prototipo.js" defer></script>
</body>
</html>
