  <main class="artboard medication-page" id="meus-remedios-page" aria-label="Meus remédios">
    <header class="medication-header">
      <div>
        <h1>Meus remédios</h1>
        <p id="medication-today">Seus horários e orientações</p>
      </div>
      <a class="medication-add-icon" href="/pages/cuidador/adicionar-remedio-cuidador.html" aria-label="Adicionar remédio">+</a>
    </header>
    <div class="medication-content">
      <section class="medication-section" aria-labelledby="medication-section-title">
        <div class="medication-section-heading">
          <h2 id="medication-section-title">Lista de remédios</h2>
          <a href="/pages/cuidador/adicionar-remedio-cuidador.html">Adicionar</a>
        </div>
        <div class="medication-list" id="medication-list" aria-live="polite">

            <div class="medication-card-heading"><h3>Losartana</h3><p class="medication-status">TOMADO</p></div>
            <p class="medication-dosage">50 mg · 1 comprimido</p><p class="medication-schedule">09:00 · Após o café</p><p class="medication-period">Uso contínuo</p>
          </a>
          <a class="medication-card" href="/pages/cuidador/remedio-registrado-cuidador.html?id=sample-metformina" aria-label="Ver Metformina">
            <div class="medication-card-heading"><h3>Metformina</h3><p class="medication-status">PENDENTE</p></div>
            <p class="medication-dosage">850 mg · 1 comprimido</p><p class="medication-schedule">19:00 · Após o jantar</p><p class="medication-period">Uso contínuo</p>
          </a>
        </div>
        <p class="visually-hidden" id="medication-feedback" role="status" aria-live="polite"></p>
      </section>
      <a class="medication-details-link" href="/pages/cuidador/sinais-vitais-cuidador.html">Ver mais informações médicas <span aria-hidden="true">›</span></a>
      <a class="medication-add-button" href="/pages/cuidador/adicionar-remedio-cuidador.html">Adicionar remédio</a>
    </div>
