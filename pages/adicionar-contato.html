<div class="page-heading">
<div>

<h1>Adicionar contato</h1>
<p class="subtitle">Quem você quer ter sempre por perto?</p>
</div>

</div>
<section class="card">
<h2>Uma pessoa de confiança</h2>
<form id="contact-form">
<div class="field">
<label for="name">Nome</label>
<input id="name" name="name" type="text" placeholder="Como essa pessoa se chama?" required>
</div>
<div class="field">
<label for="phone">Telefone com DDD</label>
<input id="phone" name="phone" type="tel" placeholder="Ex.: 11 99999-9999" required>
</div>
<div class="field">
<label for="relationship">Vínculo (opcional)</label>
<input id="relationship" name="relationship" type="text" placeholder="Ex.: filha, amigo, cuidador" >
</div>
<p id="contact-status" role="alert">
</p>
<button type="submit">Salvar contato</button>
</form>
</section>

</main>
</div>
