<div>

<h1>Nova consulta</h1>
<p class="subtitle">Reserve um espaço na agenda para cuidar de você.</p>
</div>

</div>
<div class="form-layout">
<section class="card">
<form class="appointment-form" id="appointment-form">
        <input class="appointment-field" id="appointment-specialty" name="specialty" type="text" placeholder="Ex.: Cardiologista" required>
        <input class="appointment-field" id="appointment-date" name="date" type="date" required>
        <input class="appointment-field" id="appointment-time" name="time" type="time" required>
        <input class="appointment-field" id="appointment-location" name="location" type="text" placeholder="Clínica, endereço ou online" required>
        <p class="visually-hidden" id="appointment-form-message" role="status" aria-live="polite">
</p>
        <button class="appointment-save-button" type="submit">Salvar consulta</button>
      </form>
</section>
<aside class="tip-card">
<span class="icon-tile">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>
<path d="M5 12h4l2-4 2 8 2-4h4"/>
</svg>
</span>
<h2>Pequenos passos.<br>Grandes cuidados.</h2>
<p>Confira as informações antes de salvar. Se precisar, peça ajuda a alguém de confiança.</p>
